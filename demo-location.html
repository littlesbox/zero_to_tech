<!DOCTYPE html>
<html>
<head>
<style>
  body {
    height: 2000px; /* 故意拉长页面，制造滚动条 */
    padding-top: 20px;
  }

  /* 父级容器：relative 给红色盒子当“参照物” */
  .parent {
    position: relative;
    width: 400px;
    height: 300px;
    background: #ecf0f1;
    margin: 0 auto;
    border-radius: 12px;
  }

  /* ① 相对定位 (relative)：占着茅坑，往右偏移 */
  .box-relative {
    position: relative;
    top: 20px;
    left: 30px;
    background: #3498db;
    color: white;
    padding: 10px;
    width: 150px;
  }

  /* ② 绝对定位 (absolute)：相对于 .parent 定位，不占空间 */
  .box-absolute {
    position: absolute;
    bottom: 20px;   /* 距离父级底部20px */
    right: 20px;    /* 距离父级右侧20px */
    background: #e74c3c;
    color: white;
    padding: 10px;
    width: 150px;
    margin: 20px; /* 绝对定位的盒子不占空间，所以 margin 不会影响其他元素 */
  }

  /* ③ 固定定位 (fixed)：相对于浏览器窗口，滚动也不动 */
  .box-fixed {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #2ecc71;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  /* ④ 粘性定位 (sticky)：吸顶效果 */
  .box-sticky {
    position: sticky;
    top: 20px;        /* 滚动到顶部时粘住 */
    background: #f39c12;
    color: white;
    padding: 10px;
    margin-top: 30px;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="parent">
    <div class="box-relative">📍 我 relative (偏移了，但占位还在)</div>
    <div class="box-absolute">🎯 我 absolute (钉在父级右下角)</div>
    <p style="margin-top: 50px; color: #555;">我是普通文字，absolute盒子不占空间，所以我会顶上来。
    </p>
  </div>
  <div class="box-sticky">📌 我是 sticky，滚动到顶部我就粘住！</div>
  <div class="box-fixed">⬆️ 我是 fixed (返回顶部)</div>

</body>
</html>
